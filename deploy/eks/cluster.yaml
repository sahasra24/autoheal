# eksctl create cluster -f deploy/eks/cluster.yaml     (~15 min, billable AWS resources)
# eksctl delete cluster -f deploy/eks/cluster.yaml     (tear down when done!)
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: autoheal
  region: us-east-1
  version: "1.31"
  tags:
    project: autoheal
iam:
  withOIDC: true          # IAM Roles for Service Accounts (IRSA)
  serviceAccounts:
    - metadata: {name: aws-load-balancer-controller, namespace: kube-system}
      wellKnownPolicies: {awsLoadBalancerController: true}
addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy": "true"}'   # enforce NetworkPolicies natively
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies: {ebsCSIController: true}
  - name: metrics-server       # required by the HorizontalPodAutoscaler
managedNodeGroups:
  - name: workers
    instanceType: t3.medium
    minSize: 2
    desiredCapacity: 2
    maxSize: 4
    volumeSize: 30
    privateNetworking: true
    labels: {role: workers}
