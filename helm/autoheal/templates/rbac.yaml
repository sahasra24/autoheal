{{- range $component := list "gateway" "tasks" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "autoheal.name" (dict "root" $ "component" $component) }}
  labels:
    {{- include "autoheal.labels" (dict "root" $ "component" $component) | nindent 4 }}
# These services never call the Kubernetes API: don't mount a token at all.
automountServiceAccountToken: false
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-control
  labels:
    {{- include "autoheal.labels" (dict "root" . "component" "control") | nindent 4 }}
---
# Least privilege: read-only on the platform's own namespace. Pod deletion is
# granted only while failure injection is enabled.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-control
  labels:
    {{- include "autoheal.labels" (dict "root" . "component" "control") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  {{- if .Values.chaos.enabled }}
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-control
  labels:
    {{- include "autoheal.labels" (dict "root" . "component" "control") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-control
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-control
    namespace: {{ .Release.Namespace }}
