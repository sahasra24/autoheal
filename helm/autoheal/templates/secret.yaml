{{- /* Reuse existing generated values so upgrades don't rotate secrets. */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "autoheal.secretName" .)) | default dict -}}
{{- $data := (get $existing "data") | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autoheal.secretName" . }}
  labels:
    {{- include "autoheal.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
data:
  redis-password: {{ .Values.secrets.redisPassword | default (get $data "redis-password" | b64dec) | default (randAlphaNum 32) | b64enc | quote }}
  chaos-token: {{ .Values.secrets.chaosToken | default (get $data "chaos-token" | b64dec) | default (randAlphaNum 32) | b64enc | quote }}
  api-keys: {{ .Values.secrets.apiKeys | default (get $data "api-keys" | b64dec) | default "" | b64enc | quote }}
