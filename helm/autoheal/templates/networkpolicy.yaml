{{- if .Values.networkPolicy.enabled }}
{{- $rel := .Release.Name }}
# Zero trust inside the namespace: deny all ingress, then allow only the
# call graph the platform actually has. (Needs a policy-enforcing CNI:
# Calico, Cilium, or the VPC CNI network-policy agent on EKS.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-default-deny
  labels:
    {{- include "autoheal.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $rel }}
  policyTypes: [Ingress]
---
# Gateway: the public entry point.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-gateway-ingress
  labels:
    {{- include "autoheal.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "autoheal.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8000}]
---
# Tasks: from gateway (API), control (failure injection), Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-tasks-ingress
  labels:
    {{- include "autoheal.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "autoheal.selectorLabels" (dict "root" . "component" "tasks") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "autoheal.peer" (dict "root" . "component" "gateway") | nindent 8 }}
        {{- include "autoheal.peer" (dict "root" . "component" "control") | nindent 8 }}
        {{- include "autoheal.monitoringPeer" . | nindent 8 }}
      ports: [{port: 8000}]
---
# Control: from gateway (read-only views) and Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-control-ingress
  labels:
    {{- include "autoheal.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "autoheal.selectorLabels" (dict "root" . "component" "control") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "autoheal.peer" (dict "root" . "component" "gateway") | nindent 8 }}
        {{- include "autoheal.monitoringPeer" . | nindent 8 }}
      ports: [{port: 8000}]
---
# Redis: only the services that use it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-redis-ingress
  labels:
    {{- include "autoheal.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "autoheal.selectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "autoheal.peer" (dict "root" . "component" "gateway") | nindent 8 }}
        {{- include "autoheal.peer" (dict "root" . "component" "tasks") | nindent 8 }}
      ports: [{port: 6379}]
{{- end }}
