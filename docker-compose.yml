# Local development stack:  docker compose up --build
#
#   Gateway     http://localhost:8080/docs
#   Control     http://localhost:8090        (dashboard; cluster views need Kubernetes)
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3000        (admin / admin)
#
# Compose gives you restart-on-crash (restart policy) but NOT liveness-based
# restarts, readiness routing or autoscaling - that is what Kubernetes adds.

x-service-env: &service-env
  ENVIRONMENT: development
  LOG_JSON: "true"
  LOG_LEVEL: INFO
  CHAOS_ENABLED: "true"
  CHAOS_TOKEN: ${CHAOS_TOKEN:-local-chaos-token}
  REDIS_URL: redis://:${REDIS_PASSWORD:-autoheal-dev}@redis:6379/0

x-service: &service
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-autoheal-dev}", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-autoheal-dev}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-autoheal-dev}
    volumes: [redis-data:/data]

  tasks:
    <<: *service
    build: {context: ., dockerfile: services/tasks/Dockerfile}
    image: autoheal-tasks:local
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "1.0", memory: 512M}
    environment:
      <<: *service-env
      WORKER_CONCURRENCY: "2"

  gateway:
    <<: *service
    build: {context: ., dockerfile: services/gateway/Dockerfile}
    image: autoheal-gateway:local
    ports: ["8080:8000"]
    environment:
      <<: *service-env
      TASKS_URL: http://tasks:8000
      CONTROL_URL: http://control:8000
      RATE_LIMIT_REQUESTS: "300"
      RATE_LIMIT_WINDOW_SECONDS: "60"

  control:
    <<: *service
    build: {context: ., dockerfile: services/control/Dockerfile}
    image: autoheal-control:local
    ports: ["8090:8000"]
    environment:
      <<: *service-env
      CLUSTER_BACKEND: none
      CHAOS_DIRECT_TARGETS: tasks=http://tasks:8000,gateway=http://gateway:8000

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./deploy/compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./helm/autoheal/files/alerts:/etc/prometheus/rules:ro

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/autoheal-overview.json
    volumes:
      - ./deploy/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./helm/autoheal/files/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  redis-data:
